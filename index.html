<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sylegro Portal</title>
<link rel="stylesheet" href="assets/style.css">
<style>
  body { display: flex; align-items: center; justify-content: center; min-height: 100vh; }
  .chooser { text-align: center; max-width: 480px; padding: 20px; }
  .chooser h1 { font-size: 1.6rem; margin-bottom: 6px; }
  .chooser p { color: var(--color-text-muted); margin-bottom: 32px; }
  .options { display: flex; gap: 16px; justify-content: center; }
  .option {
    flex: 1; background: var(--color-surface); border: 1px solid var(--color-border);
    border-radius: var(--radius); padding: 28px 20px; text-decoration: none; color: var(--color-text);
  }
  .option:hover { border-color: var(--color-primary); text-decoration: none; }
  .option .icon { font-size: 1.8rem; margin-bottom: 10px; }
  .option .title { font-weight: 700; margin-bottom: 4px; }
  .option .desc { font-size: 0.82rem; color: var(--color-text-muted); }
</style>
</head>
<body>
  <div class="chooser">
    <h1>Sylegro Portal</h1>
    <p>Prototyp. Bitte Bereich wählen:</p>
    <div class="options">
      <a class="option" href="login.html">
        <div class="icon">🧾</div>
        <div class="title">Kundenportal</div>
        <div class="desc">Login mit Demo-Testkunden</div>
      </a>
      <a class="option" href="mitarbeiter/dashboard.html">
        <div class="icon">🧹</div>
        <div class="title">Mitarbeiterportal</div>
        <div class="desc">Zeiterfassung, Material, Einsätze</div>
      </a>
    </div>
  </div>
</body>
</html>
