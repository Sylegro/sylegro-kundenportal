<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../assets/supabase-client.js"></script>
<script src="../assets/auth.js"></script>
<script>
  (async function () {
    const kunde = await sylegroRequireLogin();
    if (!kunde) return;
    sylegroApplyNavVisibility(kunde);

    const { data: vertraege } = await supabaseClient
      .from('contracts')
      .select('nr, titel, start_datum, laufzeit, status')
      .eq('customer_id', kunde.customerId)
      .order('start_datum', { ascending: false });

    const body = document.getElementById('vertraege-body');
    (vertraege || []).forEach(v => {
      const tr = document.createElement('tr');
      const badgeClass = v.status === 'aktiv' ? 'success' : (v.status === 'laeuft_aus' ? 'warning' : 'neutral');
      const badgeText = v.status === 'aktiv' ? 'Aktiv' : (v.status === 'laeuft_aus' ? 'Läuft bald aus' : (v.status || '—'));
      tr.innerHTML = '<td>' + v.nr + '</td><td>' + v.titel + '</td><td>Start ' + v.start_datum + ', ' + v.laufzeit + '</td><td><span class="badge ' + badgeClass + '">' + badgeText + '</span></td><td><a href="#">Details</a></td>';
      body.appendChild(tr);
    });
    if (!vertraege || vertraege.length === 0) {
      body.innerHTML = '<tr><td colspan="5" class="hint">Noch keine Verträge hinterlegt.</td></tr>';
    }
  })();
</script>
