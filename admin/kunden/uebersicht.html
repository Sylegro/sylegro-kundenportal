<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Admin – Kunden | Sylegro Portal</title>
<link rel="stylesheet" href="../../assets/style.css">
</head>
<body>
<div class="app-shell">
  <aside class="sidebar">
    <div class="brand">Sylegro <small>Admin</small></div>
    <nav>
      <a href="uebersicht.html" class="top-cat active">Kunden</a>
      <a href="uebersicht.html" class="sub-item active">Alle Kunden</a>
      <a href="#" class="sub-item disabled">Ansprechpartner (bald)</a>
      <a href="#" class="sub-item disabled">Dokumente (bald)</a>

      <a href="../mitarbeiter/uebersicht.html" class="top-cat">Mitarbeiter</a>

      <a href="../betrieb/uebersicht.html" class="top-cat">Betrieb</a>
    </nav>
    <div style="margin-top:auto; padding-top:20px;">
      <a href="#" onclick="sylegroLogout(); return false;" style="font-size:0.8rem; opacity:0.85;">Abmelden</a>
    </div>
  </aside>
  <main class="main">
    <div class="topbar">
      <h1>Kunden verwalten</h1>
      <div>
        <button class="btn" onclick="bexioSync()">Von Bexio synchronisieren</button>
        <span id="bexio-status" style="margin-left:10px; font-size:0.85rem;"></span>
      </div>
    </div>

    <div class="card">
      <h2>Alle Kunden</h2>
      <p class="hint">Klicke auf einen Kunden, um Stammdaten, Leistungen, Login und Dokumente zu bearbeiten.</p>
      <table>
        <thead><tr><th>Firma</th><th>Objekt</th><th>Branche</th><th>Login-E-Mail</th><th>Leistungen</th></tr></thead>
        <tbody id="kunden-body">
          <tr><td colspan="5" class="hint">Lade Kunden…</td></tr>
        </tbody>
      </table>
    </div>
  </main>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../../assets/supabase-client.js"></script>
<script src="../../assets/auth.js"></script>
<script>
  const SERVICE_LABEL = { uhr: 'Unterhaltsreinigung', spezial: 'Spezialreinigung', bau: 'Baureinigung', hauswartung: 'Hauswartung' };

  async function ladeKunden() {
    const body = document.getElementById('kunden-body');
    const { data: customers, error } = await supabaseClient
      .from('customers')
      .select('id, firma, objekt, branche, login_email, customer_services(service)')
      .order('firma');

    if (error) {
      body.innerHTML = '<tr><td colspan="5" class="hint">Fehler beim Laden: ' + error.message + '</td></tr>';
      return;
    }
    if (!customers || customers.length === 0) {
      body.innerHTML = '<tr><td colspan="5" class="hint">Noch keine Kunden angelegt.</td></tr>';
      return;
    }

    body.innerHTML = '';
    customers.forEach(c => {
      const services = (c.customer_services || []).map(s => SERVICE_LABEL[s.service] || s.service).join(', ') || '—';
      const tr = document.createElement('tr');
      tr.style.cursor = 'pointer';
      tr.innerHTML = '<td>' + c.firma + '</td><td>' + (c.objekt || '—') + '</td><td>' + (c.branche || '—') + '</td><td>' + (c.login_email || '—') + '</td><td>' + services + '</td>';
      tr.addEventListener('click', () => { window.location.href = 'detail.html?id=' + c.id; });
      body.appendChild(tr);
    });
  }

  async function bexioSync() {
    const status = document.getElementById('bexio-status');
    status.textContent = 'Synchronisiere mit Bexio…';
    status.style.color = 'var(--color-text-muted)';

    const { data, error } = await supabaseClient.functions.invoke('bexio-sync-kunden', {});

    if (error || (data && data.error)) {
      status.textContent = 'Fehler: ' + (data && data.error ? data.error : error.message);
      status.style.color = 'var(--color-danger)';
      return;
    }

    status.textContent = 'Fertig: ' + data.neu + ' neu, ' + data.aktualisiert + ' aktualisiert (von ' + data.gesamt + ' Bexio-Kontakten).';
    status.style.color = 'var(--color-success)';
    ladeKunden();
  }

  (async function () {
    const admin = await sylegroRequireAdmin();
    if (!admin) return;
    ladeKunden();
  })();
</script>
</body>
</html>
