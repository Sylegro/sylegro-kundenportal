<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Login | Sylegro Portal</title>
<link rel="stylesheet" href="assets/style.css">
</head>
<body>
  <div style="max-width:420px; margin:80px auto; padding:0 20px;">
    <div class="card">
      <h2 style="margin-bottom:4px;">Sylegro Portal</h2>
      <p class="hint">Anmeldung</p>

      <label style="display:block; font-size:0.85rem; margin-bottom:6px;">E-Mail</label>
      <input id="login-user" type="email" style="width:100%; padding:9px; border:1px solid var(--color-border); border-radius:6px; margin-bottom:14px;">

      <label style="display:block; font-size:0.85rem; margin-bottom:6px;">Passwort</label>
      <input id="login-pass" type="password" style="width:100%; padding:9px; border:1px solid var(--color-border); border-radius:6px; margin-bottom:16px;">

      <button class="btn primary" style="width:100%;" onclick="handleLogin()">Anmelden</button>
      <div id="login-error" style="display:none; margin-top:12px;"><span class="badge danger">E-Mail oder Passwort falsch</span></div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="assets/supabase-client.js"></script>
  <script>
    async function handleLogin() {
      const email = document.getElementById('login-user').value.trim();
      const password = document.getElementById('login-pass').value;
      document.getElementById('login-error').style.display = 'none';

      const { error } = await supabaseClient.auth.signInWithPassword({ email, password });
      if (error) {
        document.getElementById('login-error').style.display = 'block';
        return;
      }

      // Anmeldung war korrekt – jetzt herausfinden, welche Rolle das Konto
      // hat, und zur passenden, für diese Rolle vorgesehenen Ansicht
      // weiterleiten. Was diese Rolle dann sehen darf, wird zusätzlich
      // serverseitig über Row-Level-Security durchgesetzt, nicht nur hier.
      const { data: { session } } = await supabaseClient.auth.getSession();
      const { data: profile } = await supabaseClient
        .from('profiles')
        .select('role')
        .eq('id', session.user.id)
        .single();

      if (profile && profile.role === 'admin') {
        window.location.href = "admin/kunden.html";
      } else if (profile && profile.role === 'kunde') {
        window.location.href = "kunde/dashboard.html";
      } else if (profile && profile.role === 'mitarbeiter') {
        window.location.href = "mitarbeiter/dashboard.html";
      } else {
        // Kein gültiges Profil/keine erkannte Rolle -> sofort wieder
        // abmelden und dieselbe generische Fehlermeldung zeigen wie bei
        // falschem Passwort. Kein zusätzlicher Hinweis, was genau fehlt.
        await supabaseClient.auth.signOut();
        document.getElementById('login-error').style.display = 'block';
      }
    }
    document.getElementById('login-pass').addEventListener('keydown', function (e) {
      if (e.key === 'Enter') handleLogin();
    });
  </script>
</body>
</html>
